name: CD
on:
  workflow_run:
    workflows: ["CI (Intégration Continue)"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  deploy-test:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: test
      url: http://${{ secrets.VPS_HOST }}:8080
    steps:
      - name: Deploy to OVH VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop taskflow-api || true
            docker rm taskflow-api || true
            docker run -d \
              --name taskflow-api \
              --restart always \
              -p 8080:8080 \
              ghcr.io/${{ github.repository }}:latest
            docker image prune -f

      - name: Smoke test
        run: |
          sleep 10
          curl --fail http://${{ secrets.VPS_HOST }}:8080/actuator/health
